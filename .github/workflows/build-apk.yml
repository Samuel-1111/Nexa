name: Build NEXA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout NEXA
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Write local.properties from secrets
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "NEXA_SUPABASE_URL=${{ secrets.NEXA_SUPABASE_URL }}" >> local.properties
          echo "NEXA_SUPABASE_ANON_KEY=${{ secrets.NEXA_SUPABASE_ANON_KEY }}" >> local.properties

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload NEXA APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# Cloud build uses the GitHub-hosted Android SDK.
