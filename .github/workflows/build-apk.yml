name: Build NEXA APK
# Manual/tester build workflow

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout NEXA
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Write local.properties from optional CI secrets
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "${{ secrets.NEXA_SUPABASE_URL }}" ]; then echo "NEXA_SUPABASE_URL=${{ secrets.NEXA_SUPABASE_URL }}" >> local.properties; fi
          if [ -n "${{ secrets.NEXA_SUPABASE_ANON_KEY }}" ]; then echo "NEXA_SUPABASE_ANON_KEY=${{ secrets.NEXA_SUPABASE_ANON_KEY }}" >> local.properties; fi

      - name: Verify NEXA backend configuration
        run: |
          test -n "${{ secrets.NEXA_SUPABASE_URL }}" || echo "Using checked-in public Supabase URL fallback."
          test -n "${{ secrets.NEXA_SUPABASE_ANON_KEY }}" || echo "Using checked-in public Supabase publishable-key fallback."

      - name: Verify Gradle and Java
        run: |
          java -version
          gradle --version

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload NEXA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# Cloud build uses the GitHub-hosted Android SDK.
# Fresh tester build trigger.
# Retry build after requested tester rebuild.
